<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Youseph Elkhouly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      background: #ffffff;
      color: #111;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 620px; margin: 0 auto; padding: 72px 24px 120px; }

    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 48px;
    }
    .brand { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; text-decoration: none; color: #111; }
    .back { font-size: 0.9rem; color: #888; text-decoration: none; }
    .back:hover { color: #111; }

    h1.title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .intro { color: #888; font-size: 1rem; margin-bottom: 44px; }

    .post {
      display: block;
      text-decoration: none;
      color: inherit;
      padding: 22px 0;
      border-top: 1px solid #eee;
      transition: padding-left 0.2s ease;
    }
    .post:last-child { border-bottom: 1px solid #eee; }
    .post:hover { padding-left: 6px; }
    .post .date { font-size: 0.8rem; color: #999; margin-bottom: 4px; }
    .post h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 6px; }
    .post p { font-size: 0.95rem; color: #555; }

    .foot { margin-top: 56px; font-family: 'Caveat', cursive; font-size: 1.4rem; color: #111; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="index.html" class="brand">Youseph Elkhouly</a>
      <a href="index.html" class="back">&larr; Back to portfolio</a>
    </div>

    <h1 class="title">Blog</h1>
    <p class="intro">Notes on what I'm building, learning, and shipping.</p>

    <p class="foot">Posts coming soon &mdash; check back!</p>
  </div>
</body>
</html>
